description: 'AirQuality (爱优特) is a Shanghai-based manufacturer of high-efficiency electrostatic
  air purification and disinfection products, including central air filtration systems, commercial
  kitchen exhaust (hood) cleaners, odor-elimination units, and smart air-quality detection systems
  for schools, hospitals, offices, shopping malls, and hotels. The company was surfaced as a portfolio
  company of Qiming and added to the API Evangelist network as a stub. It is a hardware/manufacturing
  business that publishes a consumer website and online shop but no public developer API, SDK, or
  documentation surface at this time, so most enrichment artifacts are not applicable.'
